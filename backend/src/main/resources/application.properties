# BillBeacon backend — Spring Boot (Java 17)
server.port=${PORT:8080}
spring.application.name=billbeacon-backend
# Google AI Studio key, server-side only. Never commit a key here.
billbeacon.gemini.api-key=${GEMINI_API_KEY:}
billbeacon.gemini.model=gemini-3.5-flash-lite
billbeacon.gemini.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
spring.jackson.serialization.write-dates-as-timestamps=false
